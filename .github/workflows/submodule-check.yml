name: submodule-check
# mainへのpushとPRの両方で検証する。現在の運用（submoduleをマージしてから親のポインタを更新する）では
# 親PRの時点でもポインタは各mainに実在するコミットを指すため、PRでの検証は運用違反の早期検出になる。
# また、このチェックを必須status checkにすることで「mainに追従していないPRはマージ不可」(strict)を効かせる
on:
  push:
    branches: [main]
  pull_request:
# 既定はリポジトリ設定依存のため、必要な読み取りのみを明示する（最小権限）
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - name: submoduleの参照コミットが各リポジトリのmainに含まれるか検証
        # squashマージするとsubmoduleの参照コミットがmainから消えて迷子になる事故の検知
        run: |
          git submodule foreach '
            # checkoutが作るshallow cloneのままでは中間履歴がなく、ポインタがmainより古いだけの
            # 正常な状態でも祖先判定に失敗するため、履歴を完全化してから検証する
            # (--unshallowは非shallowリポジトリではエラーになるためフォールバック付き)
            git fetch origin main --unshallow --quiet 2>/dev/null || git fetch origin main --quiet
            git merge-base --is-ancestor HEAD origin/main \
              || { echo "::error::$name がmainに存在しないコミットを参照しています(squashマージの疑い)"; exit 1; }
          '
