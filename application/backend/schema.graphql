enum CashFlowSign {
  NEGATIVE
  POSITIVE
}

type FinancialIndicators {
  assetTurnover: FinancialMetric!
  financialLeverage: FinancialMetric!
  netProfitMargin: FinancialMetric!
  roa: FinancialMetric!
  roe: FinancialMetric!
}

type FinancialMetric {
  """
  値の出所。欠損・算出不可ではnull
  """
  source: FinancialMetricSource
  status: FinancialMetricStatus!

  """
  倍率（0.16 = 16%）。表示直前まで丸めない
  """
  value: Float
}

enum FinancialMetricSource {
  """
  当サイトの定義による計算値
  """
  CALCULATED

  """
  同じ有報・会計基準・連結区分の企業公表値。計算条件は提出書類の注記による
  """
  DISCLOSED
}

enum FinancialMetricStatus {
  """
  計算値または企業公表値あり
  """
  AVAILABLE

  """
  必要な金額・期首値がない
  """
  MISSING_DATA

  """
  分母が0以下などの理由で算出できない
  """
  NOT_CALCULABLE
}

type FinancialReport {
  """
  表示中の財務諸表の基準（バッジ表示用。描画分岐に使わないこと）
  """
  accountingStandard: String!
  balanceSheet: StackChart!
  cashFlow: WaterfallChart!
  companyName: String

  """
  "consolidated" | "non_consolidated"
  """
  consolidationType: String!
  filingDate: String
  financialIndicators: FinancialIndicators!
  fiscalYearEndDate: String!
  fiscalYearStartDate: String!
  id: ID!
  presentationFormat: String!
  profitLoss: StackChart!

  """
  4桁（EDINETの5桁から末尾0を落として返す）
  """
  stockCode: String
}

"""
円単位の金額。Int32の範囲を超え得るがJSON上は数値のまま返す
"""
scalar Money

type Query {
  """
  有報の財務3表チャート一覧（提出日降順）
  """
  financialReports(financingCfSign: CashFlowSign, investingCfSign: CashFlowSign, limit: Int!, offset: Int!, operatingCfSign: CashFlowSign, stockCodes: [String!]): [FinancialReport!]!
}

type Segment {
  """
  描画高さ（常に0以上）
  """
  amount: Money!
  colorRole: String!
  key: String!
  label: String!

  """
  %（spacer等の非表示セグメントはnull）
  """
  ratio: Float

  """
  実値（ツールチップ用。損失は負）
  """
  signedAmount: Money!

  """
  ツールチップでの表示名（nullならlabelを表示）
  """
  tooltipLabel: String
}

type StackBar {
  label: String!
  segments: [Segment!]!
}

type StackChart {
  bars: [StackBar!]!

  """
  renderable=false のとき表示する説明文
  """
  note: String
  renderable: Boolean!
}

type WaterfallChart {
  note: String
  renderable: Boolean!
  steps: [WaterfallStep!]!
}

type WaterfallStep {
  """
  符号付き（増減の向きが情報のため）
  """
  amount: Money!

  """
  "cashIncrease" | "cashDecrease"（Segmentと同じくフロントのパレット対応キー）
  """
  colorRole: String!
  key: String!

  """
  "balance"（残高・0起点） | "flow"（増減・累積位置から描く）
  """
  kind: String!
  label: String!
}
