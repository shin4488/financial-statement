type BalanceSheet {
  amount: BalanceSheetAmount
  ratio: BalanceSheetRatio
}

type BalanceSheetAmount {
  currentAsset: BigInt
  currentLiability: BigInt
  intangibleAsset: BigInt
  investmentAndOtherAsset: BigInt
  netAsset: BigInt
  noncurrentLiability: BigInt
  propertyPlantAndEquipment: BigInt
}

type BalanceSheetRatio {
  currentAsset: Float
  currentLiability: Float
  intangibleAsset: Float
  investmentAndOtherAsset: Float
  netAsset: Float
  noncurrentLiability: Float
  propertyPlantAndEquipment: Float
}

"""
Represents non-fractional signed whole numeric values. Since the value may
exceed the size of a 32-bit integer, it's encoded as a string.
"""
scalar BigInt

type CashFlow {
  endingCash: BigInt
  financingActivitiesCashFlow: BigInt
  investingActivitiesCashFlow: BigInt
  operatingActivitiesCashFlow: BigInt
  startingCash: BigInt
}

enum CashFlowSign {
  NEGATIVE
  POSITIVE
}

type CompanyFinancialStatement {
  balanceSheet: BalanceSheet
  cashFlow: CashFlow
  companyJapaneseName: String
  consolidatedInductoryCode: String
  filingDate: String
  fiscalYearEndDate: String
  fiscalYearStartDate: String
  hasConsolidatedFinancialStatement: Boolean
  id: ID!
  nonConsolidatedInductoryCode: String
  profitLoss: ProfitLoss
  stockCode: String
}

type FinancialReport {
  """
  表示中の財務諸表の基準（バッジ表示用。描画分岐に使わないこと）
  """
  accountingStandard: String!
  balanceSheet: StackChart!
  cashFlow: WaterfallChart!
  companyName: String

  """
  "consolidated" | "non_consolidated"
  """
  consolidationType: String!
  filingDate: String
  fiscalYearEndDate: String!
  fiscalYearStartDate: String!
  id: ID!
  presentationFormat: String!
  profitLoss: StackChart!

  """
  4桁（EDINETの5桁から末尾0を落として返す）
  """
  stockCode: String
}

"""
円単位の金額。Int32の範囲を超え得るがJSON上は数値のまま返す
"""
scalar Money

enum NumberSign {
  NEGATIVE
  POSITIVE
}

type ProfitLoss {
  amount: ProfitLossAmount
  ratio: ProfitLossRatio
}

type ProfitLossAmount {
  netSales: BigInt
  operatingIncome: BigInt
  originalCost: BigInt
  sellingGeneralExpense: BigInt
}

type ProfitLossRatio {
  netSales: Float
  operatingIncome: Float
  originalCost: Float
  sellingGeneralExpense: Float
}

type Query {
  """
  Find Company Financial Statement by limit
  """
  companyFinancialStatements(financingActivitiesCashFlowSign: NumberSign, investingActivitiesCashFlowSign: NumberSign, limit: Int!, offset: Int!, operatingActivitiesCashFlowSign: NumberSign, stockCodes: [String!]): [CompanyFinancialStatement!]

  """
  有報の財務3表チャート一覧（提出日降順）
  """
  financialReports(financingCfSign: CashFlowSign, investingCfSign: CashFlowSign, limit: Int!, offset: Int!, operatingCfSign: CashFlowSign, stockCodes: [String!]): [FinancialReport!]!
}

type Segment {
  """
  描画高さ（常に0以上）
  """
  amount: Money!
  colorRole: String!
  key: String!
  label: String!

  """
  %（spacer等の非表示セグメントはnull）
  """
  ratio: Float

  """
  実値（ツールチップ用。損失は負）
  """
  signedAmount: Money!
}

type StackBar {
  label: String!
  segments: [Segment!]!
}

type StackChart {
  bars: [StackBar!]!

  """
  renderable=false のとき表示する説明文
  """
  note: String
  renderable: Boolean!
}

type WaterfallChart {
  note: String
  renderable: Boolean!
  steps: [WaterfallStep!]!
}

type WaterfallStep {
  """
  符号付き（増減の向きが情報のため）
  """
  amount: Money!
  key: String!

  """
  "balance"（残高・0起点） | "flow"（増減・累積位置から描く）
  """
  kind: String!
  label: String!
}
