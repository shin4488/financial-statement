version: "3.8"
services:
  web:
    build: ./web
    ports:
      - 10000:80
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf
      - ./web/sites-enabled:/etc/nginx/sites-enabled
    depends_on:
      - appfront
      - appserver
  appfront:
    build: ./application/frontend
    volumes:
      - ./application/frontend:/home/app/financialStatement
      # node_modulesはホストと共有しない（Vite/rolldownがOS別のネイティブバイナリを使うため、
      # コンテナ(Linux)内でinstallした実体を名前付きボリュームに持つ）
      - frontend_node_modules:/home/app/financialStatement/node_modules
  appserver:
    build: ./application/backend
    # サーバ処理の動作確認を行えるようにポート解放する
    ports:
      - 20000:3000
    volumes:
      - ./application/backend:/home/app/financialStatement
      - ./application/backend/vendor/bundle:/home/app/financialStatement/vendor/bundle
    depends_on:
      database:
        condition: service_healthy
  database:
    build: ./database
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U financial_statement_admin
  cache:
    build: ./cache
    volumes:
      - ./cache/data:/data
volumes:
  frontend_node_modules:
